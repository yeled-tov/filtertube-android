name: Deps Audit

# בדיקת גרסאות בלבד — לא בונה כלום ולא יוצר Release.
# רץ על ענפי audit/** כי סביבת הפיתוח חסומה מול dl.google.com ו-jitpack.io,
# בעוד שה-runner של GitHub לא. כך מקבלים את הגרסאות האמיתיות במקום לנחש.
on:
  push:
    branches: ['audit/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # התקרה האמיתית לשדרוג היא compileSdk, לא "מה הגרסה האחרונה שקיימת".
      # כל AAR נושא minCompileSdk בתוך META-INF/.../aar-metadata.properties,
      # וזה מה שמפיל את הבנייה ב-CheckAarMetadata. הסקריפט בודק את הערך הזה
      # ישירות במקום לנחש לפי מספר הגרסה.
      - name: Newest versions that still fit compileSdk 36
        run: |
          python3 - <<'PY'
          import io, re, urllib.request, zipfile

          COMPILE_SDK = 36
          AGP = (8, 13, 2)
          GOOGLE = "https://dl.google.com/dl/android/maven2"

          def fetch(url, binary=False):
              data = urllib.request.urlopen(url, timeout=60).read()
              return data if binary else data.decode('utf-8', 'replace')

          def stable(v):
              return not re.search(r'(alpha|beta|rc|dev|snapshot|eap|-M)', v, re.I)

          def vkey(v):
              return [int(p) if p.isdigit() else 0 for p in re.split(r'[.\-+]', v)]

          def versions(group, artifact):
              xml = fetch(f"{GOOGLE}/{group.replace('.','/')}/group-index.xml")
              m = re.search(rf'<{re.escape(artifact)}\b[^>]*versions="([^"]+)"', xml)
              if not m:
                  return []
              vs = [v.strip() for v in m.group(1).split(',') if stable(v.strip())]
              return sorted(vs, key=vkey, reverse=True)

          def metadata(group, artifact, version):
              """(minCompileSdk, minAgpVersion) או None אם לא נמצא AAR בכלל.

              ספריות רבות ב-androidx הן היום KMP: <artifact> הוא POM בלבד,
              וה-AAR האמיתי יושב תחת <artifact>-android. בלי הניסיון הכפול הזה
              כל השורות האלה חוזרות ריקות ונראות בטעות כאילו אין להן מגבלה.
              """
              for name in (artifact, f"{artifact}-android"):
                  url = f"{GOOGLE}/{group.replace('.','/')}/{name}/{version}/{name}-{version}.aar"
                  try:
                      z = zipfile.ZipFile(io.BytesIO(fetch(url, binary=True)))
                      txt = z.read("META-INF/com/android/build/gradle/aar-metadata.properties").decode()
                  except Exception:
                      continue
                  sdk = re.search(r'minCompileSdk=(\d+)', txt)
                  agp = re.search(r'minAgpVersion=([\d.]+)', txt)
                  return (int(sdk.group(1)) if sdk else 0,
                          agp.group(1) if agp else "0")
              return None

          def fits(meta):
              if meta is None:
                  return None                      # לא ידוע — לא מניחים שזה בסדר
              sdk, agp = meta
              return sdk <= COMPILE_SDK and tuple(vkey(agp)[:3]) <= AGP

          def newest_fitting(group, artifact, probe=16):
              for v in versions(group, artifact)[:probe]:
                  meta = metadata(group, artifact, v)
                  if fits(meta):
                      return v, meta
              return None, None

          ROWS = [
            ("core-ktx",    "androidx.core", "core-ktx",                     "1.17.0"),
            ("lifecycle",   "androidx.lifecycle", "lifecycle-runtime-ktx",   "2.9.4"),
            ("activity",    "androidx.activity", "activity-compose",         "1.11.0"),
            ("navigation",  "androidx.navigation", "navigation-compose",     "2.9.5"),
            ("work",        "androidx.work", "work-runtime-ktx",             "2.10.5"),
            ("media3",      "androidx.media3", "media3-exoplayer",           "1.11.0"),
            ("gms-auth",    "com.google.android.gms", "play-services-auth",  "21.4.0"),
          ]

          print(f"compileSdk={COMPILE_SDK}  AGP={'.'.join(map(str,AGP))}")
          print(f"{'artifact':<16}{'בשימוש':<12}{'הכי חדש שמתאים':<18}{'minCompileSdk':<16}{'minAgpVersion'}")
          print("-" * 84)
          for label, g, a, cur in ROWS:
              try:
                  v, meta = newest_fitting(g, a)
                  sdk, agp = meta if meta else ("?", "?")
                  print(f"{label:<16}{cur:<12}{str(v):<18}{str(sdk):<16}{agp}")
              except Exception as e:
                  print(f"{label:<16}{cur:<12}שגיאה: {e}")

          print()
          print("compose-bom — לפי androidx.compose.ui שכל BOM מצמיד:")
          for bom in versions("androidx.compose", "compose-bom")[:14]:
              try:
                  pom = fetch(f"{GOOGLE}/androidx/compose/compose-bom/{bom}/compose-bom-{bom}.pom")
                  m = re.search(r'<artifactId>ui</artifactId>\s*<version>([^<]+)</version>', pom)
                  if not m:
                      print(f"  {bom:<14} לא נמצאה גרסת ui ב-POM")
                      continue
                  ui = m.group(1)
                  meta = metadata("androidx.compose.ui", "ui", ui)
                  ok = fits(meta)
                  if ok is None:
                      note = "? לא נמצא AAR"
                  elif ok:
                      note = f"✔ מתאים (sdk {meta[0]}, agp {meta[1]})"
                  else:
                      note = f"✖ דורש sdk {meta[0]}, agp {meta[1]}"
                  print(f"  {bom:<14} ui {ui:<10} {note}")
              except Exception as e:
                  print(f"  {bom:<14} שגיאה: {e}")
          PY

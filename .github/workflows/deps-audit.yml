name: Deps Audit

# בדיקת גרסאות בלבד — לא בונה כלום ולא יוצר Release.
# רץ על ענפי audit/** כי סביבת הפיתוח חסומה מול dl.google.com ו-jitpack.io,
# בעוד שה-runner של GitHub לא. כך מקבלים את הגרסאות האמיתיות במקום לנחש.
on:
  push:
    branches: ['audit/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # התקרה האמיתית לשדרוג היא compileSdk, לא "מה הגרסה האחרונה שקיימת".
      # כל AAR נושא minCompileSdk בתוך META-INF/.../aar-metadata.properties,
      # וזה מה שמפיל את הבנייה ב-CheckAarMetadata. הסקריפט בודק את הערך הזה
      # ישירות במקום לנחש לפי מספר הגרסה.
      - name: Newest versions that still fit compileSdk 36
        run: |
          python3 - <<'PY'
          import io, re, urllib.request, zipfile

          COMPILE_SDK = 36
          GOOGLE = "https://dl.google.com/dl/android/maven2"

          def fetch(url, binary=False):
              data = urllib.request.urlopen(url, timeout=60).read()
              return data if binary else data.decode('utf-8', 'replace')

          def stable(v):
              return not re.search(r'(alpha|beta|rc|dev|snapshot|eap|-M)', v, re.I)

          def vkey(v):
              return [int(p) if p.isdigit() else 0 for p in re.split(r'[.\-+]', v)]

          def versions(group, artifact):
              xml = fetch(f"{GOOGLE}/{group.replace('.','/')}/group-index.xml")
              m = re.search(rf'<{re.escape(artifact)}\b[^>]*versions="([^"]+)"', xml)
              if not m:
                  return []
              vs = [v.strip() for v in m.group(1).split(',') if stable(v.strip())]
              return sorted(vs, key=vkey, reverse=True)

          def min_compile_sdk(group, artifact, version):
              """None = ה-AAR לא מצהיר מגבלה (כלומר מתאים לכל compileSdk)."""
              url = f"{GOOGLE}/{group.replace('.','/')}/{artifact}/{version}/{artifact}-{version}.aar"
              try:
                  z = zipfile.ZipFile(io.BytesIO(fetch(url, binary=True)))
                  txt = z.read("META-INF/com/android/build/gradle/aar-metadata.properties").decode()
              except Exception:
                  return None
              m = re.search(r'minCompileSdk=(\d+)', txt)
              return int(m.group(1)) if m else None

          def newest_fitting(group, artifact, probe=14):
              for v in versions(group, artifact)[:probe]:
                  need = min_compile_sdk(group, artifact, v)
                  if need is None or need <= COMPILE_SDK:
                      return v, need
              return None, None

          # (תווית, group, artifact, מה שבשימוש היום)
          ROWS = [
            ("compose-ui",  "androidx.compose.ui", "ui",                     "מ-compose-bom 2024.10.00"),
            ("material3",   "androidx.compose.material3", "material3",       "מ-compose-bom 2024.10.00"),
            ("core-ktx",    "androidx.core", "core-ktx",                     "1.17.0"),
            ("lifecycle",   "androidx.lifecycle", "lifecycle-runtime-ktx",   "2.9.4"),
            ("activity",    "androidx.activity", "activity-compose",         "1.11.0"),
            ("navigation",  "androidx.navigation", "navigation-compose",     "2.9.5"),
            ("work",        "androidx.work", "work-runtime-ktx",             "2.10.5"),
            ("media3",      "androidx.media3", "media3-exoplayer",           "1.11.0"),
            ("gms-auth",    "com.google.android.gms", "play-services-auth",  "21.4.0"),
          ]

          print(f"{'artifact':<26}{'בשימוש':<26}{'הכי חדש שמתאים ל-36':<24}{'minCompileSdk'}")
          print("-" * 96)
          for label, g, a, cur in ROWS:
              try:
                  v, need = newest_fitting(g, a)
                  print(f"{label:<26}{cur:<26}{str(v):<24}{need if need is not None else '-'}")
              except Exception as e:
                  print(f"{label:<26}{cur:<26}שגיאה: {e}")

          # compose-bom הוא POM ולא AAR, אז בוחרים אותו לפי גרסת androidx.compose.ui
          # שהוא מצמיד: ה-BOM המתאים הוא זה שמצמיד גרסת ui שעוברת את הבדיקה למעלה.
          print()
          print("compose-bom — איזו גרסת androidx.compose.ui כל BOM מצמיד:")
          for bom in versions("androidx.compose", "compose-bom")[:12]:
              try:
                  pom = fetch(f"{GOOGLE}/androidx/compose/compose-bom/{bom}/compose-bom-{bom}.pom")
                  m = re.search(
                      r'<artifactId>ui</artifactId>\s*<version>([^<]+)</version>', pom)
                  ui = m.group(1) if m else "?"
                  need = min_compile_sdk("androidx.compose.ui", "ui", ui) if ui != "?" else None
                  ok = "✔ מתאים" if (need is None or need <= COMPILE_SDK) else f"✖ דורש {need}"
                  print(f"  {bom:<16} ui {ui:<12} {ok}")
              except Exception as e:
                  print(f"  {bom:<16} שגיאה: {e}")
          PY

# פריסת Cloud Functions מתוך GitHub, בלי מחשב ובלי CLI מקומי.
#
# ## למה זה קיים
# פריסת פונקציות אינה אפשרית מקונסולת Firebase — היא דורשת העלאת קוד
# ולכן CLI. מי שאין לו מחשב זמין נשאר בלי שום דרך לפרוס שינוי בשרת, וזה
# בדיוק המצב שבו תיקון מוכן יושב שבוע בלי להגיע ללקוחות.
#
# ## מה צריך פעם אחת
# סוד בשם FIREBASE_SERVICE_ACCOUNT ב-Settings → Secrets → Actions של
# המאגר, שתוכנו הוא קובץ ה-JSON של חשבון שירות עם הרשאת פריסה.
#
# ## איך מריצים
# Actions → "פריסת פונקציות" → Run workflow. או אוטומטית, בכל דחיפה
# ל-main שנוגעת ב-functions/.
name: פריסת שרת

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'מה לפרוס (ברירת מחדל: הכול)'
        required: false
        default: 'functions,firestore:rules,firestore:indexes,hosting'
        type: string
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'public/**'
      - '.github/workflows/deploy-functions.yml'

# שתי פריסות במקביל לאותו פרויקט נכשלות אחת על השנייה.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # ── התקנת התלויות, ולא רק בדיקת תחביר ─────────────────────────
      # firebase-tools טוען את קוד הפונקציות כדי לדעת מה לפרוס, ובלי
      # node_modules הטעינה נכשלת עם "Couldn't find firebase-functions
      # package" ואז "An unexpected error has occurred" — שגיאה שלא מסגירה
      # במאום שהסיבה היא תלויות חסרות.
      - name: התקנת התלויות של הפונקציות
        run: npm --prefix functions ci

      - name: בדיקת תחביר של הפונקציות
        run: npm --prefix functions run lint

      - name: כתיבת חשבון השירות לקובץ
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::חסר הסוד FIREBASE_SERVICE_ACCOUNT. ראה את ההסבר בראש הקובץ."
            exit 1
          fi
          # הקובץ נכתב מחוץ לעץ העבודה כדי שלא ייכלל בטעות בפריסה עצמה.
          printf '%s' "$SA" > "$RUNNER_TEMP/service-account.json"
          # ── מי בעצם פורס ──────────────────────────────────────────────
          # שגיאת "חסרה הרשאה על חשבון X" אומרת על מי צריך הרשאה, ולא מי
          # מבקש אותה. בלי לדעת את הזהות של המבקש אי אפשר לדעת לְמי להעניק
          # את התפקיד, וזה שולח להוסיף הרשאות לחשבון הלא נכון שוב ושוב.
          #
          # client_email ו-project_id אינם סוד — הם מזהים ציבוריים. המפתח
          # הפרטי עצמו לעולם אינו מודפס.
          node -e '
            const sa = require(process.env.RUNNER_TEMP + "/service-account.json");
            console.log("::notice::זהות הפריסה: " + sa.client_email);
            console.log("::notice::פרויקט המפתח: " + sa.project_id);
          '

      # ── מראה ההורדות ──────────────────────────────────────────────────
      # פריסת hosting מחליפה את **כל** האתר, ולכן כל פריסה חייבת לבנות את
      # האתר השלם — כולל ה-APK וקובץ הגרסאות. בלי זה פריסת שרת הייתה מוחקת
      # את ההורדות שהעלה job השחרור.
      #
      # GITHUB_TOKEN ולא כתובת ציבורית: זה מה שימשיך לעבוד כשהמאגר יהפוך
      # לפרטי — וזו כל מטרת המראה הזו.
      - name: בניית ההורדות לאתר
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/build-hosting-downloads.mjs

      - name: פריסה
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          ONLY: ${{ inputs.only }}
          # ── הפרמטרים של Creem ─────────────────────────────────────────
          # functions/.env אינו במאגר (הוא ב-.gitignore), ולכן הערכים חיים
          # רק במחשב שממנו נפרס בפעם הראשונה. בפריסה לא-אינטראקטיבית אין
          # מי שישאל אותם, והיא נעצרת.
          #
          # לכולם יש ברירת מחדל בקוד, ולכן אף אחד מהם אינו חובה: מזהי
          # המוצר ריקים כל עוד אין חשבון Creem פעיל, וביום שיהיה מוסיפים
          # אותם כסודות כאן והתשלומים מתחילים לעבוד בלי שינוי קוד.
          CREEM_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_MONTHLY_PRODUCT_ID }}
          CREEM_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_YEARLY_PRODUCT_ID }}
          CREEM_API_BASE: ${{ secrets.CREEM_API_BASE || 'https://api.creem.io' }}
          CREEM_SUCCESS_URL: ${{ secrets.CREEM_SUCCESS_URL || 'https://filter-tube-52d8e.web.app/premium/success' }}
        run: |
          # ── הערכים נכתבים לקובץ, לא נשלחים כמשתני סביבה ──────────────
          # firebase-tools מחפש פרמטרים בקובץ dotenv בתיקיית הפונקציות
          # ולא ב-process.env. העברתם כ-env נראתה נכונה אבל פשוט התעלמו
          # ממנה, והפריסה נעצרה על "no value for the following environment
          # variables" גם כשהערכים היו מוגדרים ומודפסים ביומן.
          #
          # הקובץ אינו במאגר (/functions/.env* ב-.gitignore) ונוצר כאן בכל
          # ריצה מחדש, כך שאין עותק שמתיישן בלי שאיש שם לב.
          {
            echo "CREEM_MONTHLY_PRODUCT_ID=$CREEM_MONTHLY_PRODUCT_ID"
            echo "CREEM_YEARLY_PRODUCT_ID=$CREEM_YEARLY_PRODUCT_ID"
            echo "CREEM_API_BASE=$CREEM_API_BASE"
            echo "CREEM_SUCCESS_URL=$CREEM_SUCCESS_URL"
          } > functions/.env
          npm install -g firebase-tools@15
          # ── ולמה גם hosting ───────────────────────────────────────────
          # דף ההורדה שהאפליקציה משתפת יושב שם. קישור ששותף פעם אחת חי
          # לנצח בהודעה של מישהו, ולכן הדף חייב לעלות יחד עם השאר ולא
          # בפקודה נפרדת שאפשר לשכוח.
          #
          # גם כללי האבטחה ולא רק הפונקציות: הכללים שבמאגר הם מקור האמת,
          # ואם הם לא פורסמו, מסד הנתונים חוסם את כל בקשות הלקוח — סנכרון
          # הפרופיל והספרייה מפסיק לעבוד בלי שום שגיאה גלויה באפליקציה.
          # ── למה אפשר לבחור מה לפרוס ────────────────────────────────
          # פריסת כללי אבטחה ופריסת פונקציות דורשות הרשאות שונות לגמרי.
          # כשאחת מהן חסומה, פריסה "הכול או כלום" מחזיקה בן ערובה גם את
          # החלק שמוכן — וכללי אבטחה שגויים הם תקלה פעילה אצל המשתמשים.
          firebase deploy \
            --only "${ONLY:-functions,firestore:rules,firestore:indexes,hosting}" \
            --project filter-tube-52d8e \
            --non-interactive \
            --force

      - name: ניקוי
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

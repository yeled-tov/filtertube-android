name: Test APK

# בנייה של APK לבדיקה אישית לפני שחרור ללקוחות.
#
# איך זה עובד:
#   1. דוחפים לענף שמתחיל ב-test/  →  נבנה APK ונוצר Pre-release בשם test-N.
#   2. מורידים את FilterTube-test.apk מדף ה-Releases ומתקינים על המכשיר.
#   3. רק אחרי שהבדיקה עברה — ממזגים ל-main, ואז נוצר Release רגיל (build-N)
#      שהאפליקציות של הלקוחות מזהות כעדכון.
#
# האפליקציה מתעלמת מ-Pre-release אלא אם המשתמש הפעיל "ערוץ בדיקות" בהגדרות,
# כך שלקוחות לעולם לא יקבלו התראת עדכון על גרסת טסט.

on:
  push:
    branches:
      - 'test/**'
    paths-ignore:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install and lint Firebase Functions
        run: |
          npm ci --prefix functions
          npm --prefix functions run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Test, lint, and build release APK
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest lintRelease assembleRelease \
            --no-daemon --stacktrace \
            -PbuildNumber=${{ github.run_number }} 2>&1 | tee build-output.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-build-error-log
          path: build-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FilterTube-test.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FilterTube-test-APK
          path: artifacts/FilterTube-test.apk
          retention-days: 14

  prerelease:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FilterTube-test-APK
          path: artifacts

      - name: Create pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "בדיקה ${{ github.run_number }} — ${{ github.ref_name }}"
          prerelease: true
          body: |
            **גרסת בדיקה — לא משוחררת ללקוחות.**

            ענף: `${{ github.ref_name }}`
            קומיט: ${{ github.sha }}

            להורדה: `FilterTube-test.apk` למטה.
            אחרי שהבדיקה עוברת — ממזגים ל-`main` כדי לשחרר ללקוחות.
          files: artifacts/FilterTube-test.apk

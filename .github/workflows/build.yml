name: Build APK

# workflow אחד לכל הבניות — יציבות וגם טסט.
#
# למה אחד ולא שניים: `github.run_number` הוא מונה נפרד לכל workflow. כשהיו שני
# קבצים נפרדים, בניית טסט קיבלה versionCode 6 בזמן שהגרסה היציבה הייתה 140 —
# ולכן האפליקציה בערוץ הבדיקות הציעה "עדכון" לגרסה יציבה שהקוד שלה ישן יותר,
# שוב ושוב. עכשיו יש מונה אחד משותף: מי שנבנה מאוחר יותר תמיד מקבל מספר גבוה
# יותר, וזה תמיד גם הקוד החדש יותר.
#
#   דחיפה ל-main      → Release יציב  build-N   (כל הלקוחות)
#   דחיפה ל-test/**   → Pre-release   test-N    (רק ערוץ בדיקות)

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'codex/**'
      - 'jules/**'
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install and lint Firebase Functions
        run: |
          npm ci --prefix functions
          npm --prefix functions run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Test, lint, and build release APK
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest lintRelease assembleRelease \
            --no-daemon --stacktrace \
            -PbuildNumber=${{ github.run_number }} 2>&1 | tee build-output.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-error-log
          path: build-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android lint report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-report
          path: app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p artifacts
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/FilterTube.apk
          else
            cp app/build/outputs/apk/release/app-release.apk artifacts/FilterTube-test.apk
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FilterTube-APK
          path: artifacts/*.apk
          retention-days: 30

  # ── Release יציב — רק מ-main, מגיע לכל הלקוחות ────────────────────────────
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # נדרש כדי להוריד את ה-APK מה-job הקודם: כשמצהירים permissions ברמת
      # job, ההצהרה *מחליפה* את כל הסט — ובלי actions:read הקריאה
      # ListArtifacts מוחזרת 403 ו-download-artifact נכשל.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # דרוש להיסטוריה ולתגים, כדי לבנות רשימת שינויים

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FilterTube-APK
          path: artifacts

      - name: Build Hebrew release notes
        run: bash .github/release-notes.sh stable "${{ github.run_number }}" "${{ github.ref_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          files: artifacts/FilterTube.apk
          fail_on_unmatched_files: true

  # ── Pre-release לבדיקות — רק מענפי test/**, לא מגיע ללקוחות ───────────────
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/test/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # נדרש כדי להוריד את ה-APK מה-job הקודם: כשמצהירים permissions ברמת
      # job, ההצהרה *מחליפה* את כל הסט — ובלי actions:read הקריאה
      # ListArtifacts מוחזרת 403 ו-download-artifact נכשל.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FilterTube-APK
          path: artifacts

      - name: Build Hebrew release notes
        run: bash .github/release-notes.sh test "${{ github.run_number }}" "${{ github.ref_name }}"

      - name: Create pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: true
          body_path: release-notes.md
          files: artifacts/FilterTube-test.apk
          fail_on_unmatched_files: true

# 2048m לא הספיק: R8 ו-lintVital רצים במקביל בתוך אותה JVM (--no-daemon),
# ובבנייה 200 שניהם נפלו יחד על שגיאה פנימית בלי שום שגיאת קומפילציה —
# החתימה הרגילה של מחסור בזיכרון. ל-runner של GitHub יש 16GB.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
